# Keeps the Render instance from going to sleep.
#
# A free Render service spins down after 15 minutes with no traffic and takes
# 30-60 seconds to come back. The first visitor of a quiet morning pays that,
# and on a demo it looks like the site is broken.
#
# This cannot live inside the app. A pinger running in the same process spins
# down with it, so it would only ever ping a service that was already awake.
# The request has to come from somewhere else, which is what GitHub gives us
# for free.
#
# It runs during waking hours only, and that is deliberate. A Render workspace
# gets 750 instance hours a calendar month; a 31-day month is 744, so keeping
# one service up around the clock leaves six hours of headroom and only works
# if it is the only free service in the workspace. Covering 04:00-19:00 UTC
# (09:30-00:30 IST) costs about 465 hours and leaves real room, while covering
# every hour an Indian student is plausibly awake.
#
# Set the URL under Settings -> Secrets and variables -> Actions -> Variables:
#   PING_URL = https://your-service.onrender.com/healthz

name: Keep awake

on:
  schedule:
    # Every 10 minutes, inside the 15-minute idle window, waking hours in IST.
    - cron: '*/10 4-19 * * *'
  workflow_dispatch:

# A queued run is pointless once a newer one exists.
concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health check
        env:
          URL: ${{ vars.PING_URL || 'https://schemeconnect.onrender.com/healthz' }}
        run: |
          # A cold instance takes 30-60s to answer, so allow for that rather
          # than timing out and reporting a failure that is really a wake-up.
          start=$(date +%s)
          code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 90 "$URL" || echo 000)
          took=$(( $(date +%s) - start ))

          echo "HTTP $code in ${took}s"
          cat /tmp/body || true

          if [ "$code" != "200" ]; then
            echo "::warning::Health check returned $code — the service may be down, not merely asleep."
            exit 0   # a failed ping is not a failed build; do not spam the log with red
          fi

          if [ "$took" -gt 10 ]; then
            echo "::notice::Took ${took}s, so it had spun down. Pings are not keeping up."
          fi
